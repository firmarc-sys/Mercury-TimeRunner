name: release-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Sync backend dependencies
        run: uv sync --frozen --no-dev

      - name: Compile backend
        run: uv run python -m compileall app.py routes.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate zero-build Jahorin frontend
        run: |
          set -euo pipefail
          for file in static/js/runtime.js static/js/skillui-shell.js static/js/capability.js static/js/jahorin-shell.js static/sw.js; do
            node --check "$file"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('static')
          manifest = json.loads((root / 'repo-pages.json').read_text())
          pwa = json.loads((root / 'manifest.json').read_text())
          pages = manifest['pages']
          assert len(pages) == manifest['expectedPageCount'] == 25
          assert manifest['groups'] == {'core': 5, 'syncori-audio': 10, 'syncori-optics': 10}
          assert pwa['name'] == 'Jahorin Trismegistus'
          assert pwa['display'] == 'standalone'

          missing = []
          for page in pages:
              canonical = root / page['path']
              route = page['route'].strip('/')
              alias = root / route / 'index.html'
              if not canonical.is_file():
                  missing.append(str(canonical))
              if not alias.is_file():
                  missing.append(str(alias))

          required = [
              root / 'index.html', root / 'manifest.json', root / 'sw.js',
              root / 'css/skillui.css', root / 'css/jahorin-production.css', root / 'css/jahorin-gate.css',
              root / 'js/runtime.js', root / 'js/skillui-shell.js', root / 'js/capability.js', root / 'js/jahorin-shell.js',
              root / 'syncori/index.html', root / 'syncori/audio/index.html', root / 'syncori/optics/index.html',
          ]
          missing.extend(str(path) for path in required if not path.is_file())
          if missing:
              raise SystemExit('Missing canonical Jahorin files:\n' + '\n'.join(missing))

          index = (root / 'index.html').read_text()
          shell = (root / 'js/jahorin-shell.js').read_text()
          runtime = (root / 'js/runtime.js').read_text()
          assert 'JAHORIN TRISMEGISTUS' in index
          assert 'SYSTEM INTELLIGENCE AS A SERVICE' in index
          assert 'id="jahorin-mercury"' in index
          assert '<video id="boot"' not in index
          for label in ('INTERWEB','AUGMENT','CODE','SCRIBE','OPTICS'):
              assert label in shell
          assert "const OPTICS = [['SEE'" in shell
          assert 'CAPTURE' in shell and 'ANALYZE' in shell and 'MACRO' in shell and 'EDITOR' in shell
          assert "module: 'mercury'" in runtime
          assert '399152573423' in runtime and '399152573423' in shell
          print('Jahorin SkillUI validation: PASS 25/25 + live shell')
          PY

      - name: Verify browser code contains no committed provider secrets
        run: |
          set -euo pipefail
          ! grep -RIE --exclude-dir=.git '(sk-[A-Za-z0-9_-]{16,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' static

      - name: Build production container
        run: docker build -t jahorin-trismegistus-release-gate .
