name: one-time-member-auth-billing-patch

on:
  push:
    branches: [thoth/stripe-endpoint-map]
    paths:
      - scripts/patch-member-auth-billing.py
      - .github/workflows/one-time-member-auth-billing-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: thoth/stripe-endpoint-map
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch persistent shell auth and billing
        run: python3 scripts/patch-member-auth-billing.py
      - name: Validate JavaScript syntax
        run: |
          node --check static/js/runtime.js
          node --check static/js/skillui-shell.js
      - name: Commit patched runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/js/runtime.js static/js/skillui-shell.js
          if git diff --cached --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git commit -m "Bind member auth and Stripe return flow in persistent shell"
          git push origin HEAD:thoth/stripe-endpoint-map
