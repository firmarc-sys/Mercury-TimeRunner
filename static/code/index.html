<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/css/mercury.css"><title>Jahorin Code</title></head><body data-surface="code"><main class="app"><section class="viewport"><img class="screen-image" src="/assets2/code.jpg" alt="Jahorin Code Terminal"><div class="screen-shade"></div><div class="brand"><strong>Jahorin Code</strong>Mercury execution terminal</div><div class="status">ARI · connecting</div><section class="panel"><textarea id="prompt" class="field textarea" placeholder="Describe what you want to build, debug, or execute conceptually."></textarea><div class="row"><button id="run" class="action">Send to Jahorin</button><button id="clear" class="action secondary">Clear</button></div><pre id="out" class="output">Ready.</pre></section></section><nav class="dock"></nav></main><script src="/js/runtime.js"></script><script>Mercury.dock('code');Mercury.status();const p=document.querySelector('#prompt'),o=document.querySelector('#out');document.querySelector('#run').onclick=async()=>{const t=p.value.trim();if(!t)return;o.textContent='Executing through ARI…';try{const r=await Mercury.dispatch('code',t,{prompt:t});o.textContent=r?.result?.text||JSON.stringify(r,null,2)}catch(e){o.textContent=e.message}};document.querySelector('#clear').onclick=()=>{p.value='';o.textContent='Ready.'};</script></body></html>
