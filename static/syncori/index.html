<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="/css/mercury.css">
  <link rel="stylesheet" href="/css/skillui.css">
  <title>SYNCORI Suite</title>
</head>
<body data-surface="augment">
  <main class="app">
    <section class="viewport capability-viewport">
      <img class="screen-image" src="/assets2/augment.jpg" alt="SYNCORI Suite">
      <div class="screen-shade"></div>
      <div class="brand"><strong>SYNCORI Suite</strong>Private augmented instrument studio</div>
      <div class="status">ARI · connecting</div>
      <nav class="suite-map" aria-label="SYNCORI Suite instruments">
        <a class="suite-link" data-skillui-route href="/syncori/audio/">Augmented Audio</a>
        <a class="suite-link" data-skillui-route href="/syncori/optics/">Augmented Optics</a>
      </nav>
    </section>
    <nav class="dock" aria-label="Mercury capabilities"></nav>
  </main>
  <script src="/js/runtime.js"></script>
  <script>Mercury.dock('augment');Mercury.status();</script>
</body>
</html>
