<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/css/mercury.css"><title>Mercury Interweb</title></head><body data-surface="interweb"><main class="app"><section class="viewport"><img class="screen-image" src="/assets2/interweb.jpg" alt="Interweb"><div class="screen-shade"></div><div class="brand"><strong>Interweb</strong>Mercury network instrument</div><div class="status">ARI · connecting</div><section class="panel"><div class="row"><input id="q" class="field" placeholder="Search the web or ask Jahorin"><button id="ask" class="action">Ask</button></div><div id="out" class="output hidden"></div></section></section><nav class="dock"></nav></main><script src="/js/runtime.js"></script><script>Mercury.dock('interweb');Mercury.status();const q=document.querySelector('#q'),o=document.querySelector('#out');async function ask(){const text=q.value.trim();if(!text)return;const looksUrl=/^(https?:\/\/|[\w-]+\.[a-z]{2,})(\/|$)/i.test(text);if(looksUrl){window.open(/^https?:/.test(text)?text:`https://${text}`,'_blank','noopener');return}o.classList.remove('hidden');o.textContent='Jahorin is working…';try{const r=await Mercury.dispatch('interweb',text,{prompt:text});o.textContent=r?.result?.text||r?.reply?.text||JSON.stringify(r,null,2)}catch(e){o.textContent=e.message}}document.querySelector('#ask').onclick=ask;q.addEventListener('keydown',e=>{if(e.key==='Enter')ask()});</script></body></html>
