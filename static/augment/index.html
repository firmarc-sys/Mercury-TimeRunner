<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/css/mercury.css"><title>SYNCORI Infinite Audio</title></head><body data-surface="augment"><main class="app"><section class="viewport"><img class="screen-image" src="/assets2/augment.jpg" alt="SYNCORI Infinite Audio"><div class="screen-shade"></div><div class="brand"><strong>SYNCORI Infinite Audio</strong>Augmented Audio</div><div class="status">ARI · connecting</div><section class="panel"><div class="mode-grid"><button class="action" id="record">Record</button><button class="action" id="stop">Stop</button><button class="action" id="play">Play</button><button class="action secondary pad" data-note="261.63">Pad 1</button><button class="action secondary pad" data-note="329.63">Pad 2</button><button class="action secondary pad" data-note="392.00">Pad 3</button></div><div id="out" class="output">Ready. Microphone permission is requested only when Record is pressed.</div></section></section><nav class="dock"></nav></main><script src="/js/runtime.js"></script><script>Mercury.dock('augment');Mercury.status();let rec,chunks=[],blobUrl=null,ctx;const out=document.querySelector('#out');document.querySelector('#record').onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{blobUrl&&URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));stream.getTracks().forEach(t=>t.stop());out.textContent='Capture ready.'};rec.start();out.textContent='Recording…'}catch(e){out.textContent=e.message}};document.querySelector('#stop').onclick=()=>{if(rec?.state==='recording')rec.stop()};document.querySelector('#play').onclick=()=>{if(!blobUrl)return Mercury.toast('Record a clip first.');new Audio(blobUrl).play()};document.querySelectorAll('.pad').forEach(b=>b.onclick=()=>{ctx??=new AudioContext();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=+b.dataset.note;g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.25);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.26)});</script></body></html>
