<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/mercury.css">
  <link rel="stylesheet" href="/css/skillui.css">
  <title>Agentic Mercury Time Runner</title>
</head>
<body data-surface="shell">
  <main class="app skillui-shell" id="mercury-shell">
    <header class="shell-header" aria-label="Agentic Mercury Time Runner">
      <div class="shell-brand">
        <strong id="shell-title">Agentic Mercury Time Runner</strong>
        <span id="shell-subtitle">S.I.aaS · System Intelligence as a Service</span>
      </div>
      <div class="status shell-status" aria-live="polite">ARI · connecting</div>
    </header>

    <section id="ari-viewport" class="viewport shell-viewport" aria-live="polite" aria-busy="false">
      <section id="landing" class="shell-landing" data-shell-view="landing">
        <video id="boot" class="intro-video" autoplay muted playsinline preload="auto">
          <source src="/assets2/boot.mp4" type="video/mp4">
        </video>
        <div class="screen-shade"></div>
        <div class="center-cta">
          <button id="enter" class="action" type="button">Enter Syncori Suite</button>
          <button id="demo" class="action secondary" type="button">Explore Public Demo</button>
          <p id="tae-message">Authenticated intelligence becomes an instrument.</p>
        </div>
      </section>
    </section>

    <nav id="liquid-dock" class="dock shell-dock" aria-label="Mercury capabilities"></nav>
  </main>

  <script src="/js/runtime.js"></script>
  <script type="module" src="/js/skillui-shell.js"></script>
</body>
</html>
