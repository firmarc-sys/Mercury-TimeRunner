<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/css/mercury.css"><title>Mercury Scribe</title></head><body data-surface="scribe"><main class="app"><section class="viewport"><img class="screen-image" src="/assets2/scribe.jpg" alt="Mercury Scribe"><div class="screen-shade"></div><div class="brand"><strong>Scribe</strong>Living writing instrument</div><div class="status">ARI · connecting</div><section class="panel"><textarea id="doc" class="field textarea" placeholder="Write here…"></textarea><div class="row"><button id="save" class="action secondary">Save</button><button id="jahorin" class="action">Augment</button></div><pre id="out" class="output hidden"></pre></section></section><nav class="dock"></nav></main><script src="/js/runtime.js"></script><script>Mercury.dock('scribe');Mercury.status();const d=document.querySelector('#doc'),o=document.querySelector('#out');d.value=localStorage.getItem('mercury.scribe')||'';document.querySelector('#save').onclick=()=>{localStorage.setItem('mercury.scribe',d.value);Mercury.toast('Saved on this device.')};document.querySelector('#jahorin').onclick=async()=>{const t=d.value.trim();if(!t)return;o.classList.remove('hidden');o.textContent='Jahorin is augmenting…';try{const r=await Mercury.dispatch('scribe',t,{prompt:`Help me develop this writing without losing my voice:\n\n${t}`});o.textContent=r?.result?.text||JSON.stringify(r,null,2)}catch(e){o.textContent=e.message}};</script></body></html>
