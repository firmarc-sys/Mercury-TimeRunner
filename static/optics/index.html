<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/css/mercury.css"><title>Mercury Optics</title></head><body data-surface="optics"><main class="app"><section class="viewport"><img id="poster" class="screen-image" src="/assets2/optics.jpg" alt="Mercury Optics"><video id="cam" class="camera-live hidden" autoplay muted playsinline></video><canvas id="canvas" class="hidden"></canvas><div class="camera-overlay"></div><div class="brand"><strong>Optics</strong>Augmented visual instrument</div><div class="status">ARI · connecting</div><div class="top-actions"><button class="mini" id="exit">Exit Camera</button></div><section class="panel"><div class="mode-grid"><button id="open" class="action">Camera</button><button id="snap" class="action">Capture</button><button id="analyze" class="action">Analyze</button></div><div id="out" class="output">Camera permission is requested only when Camera is pressed.</div></section></section><nav class="dock"></nav></main><script src="/js/runtime.js"></script><script>Mercury.dock('optics');Mercury.status();let stream=null,lastData=null;const cam=document.querySelector('#cam'),poster=document.querySelector('#poster'),canvas=document.querySelector('#canvas'),out=document.querySelector('#out');async function openCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});cam.srcObject=stream;cam.classList.remove('hidden');poster.classList.add('hidden');out.textContent='Camera live.'}catch(e){out.textContent=e.message}}function closeCam(){stream?.getTracks().forEach(t=>t.stop());stream=null;cam.srcObject=null;cam.classList.add('hidden');poster.classList.remove('hidden');out.textContent='Camera closed.'}document.querySelector('#open').onclick=openCam;document.querySelector('#exit').onclick=closeCam;document.querySelector('#snap').onclick=()=>{if(!stream)return Mercury.toast('Open the camera first.');canvas.width=cam.videoWidth||720;canvas.height=cam.videoHeight||1280;canvas.getContext('2d').drawImage(cam,0,0,canvas.width,canvas.height);lastData=canvas.toDataURL('image/jpeg',.78);out.innerHTML=`Captured. <button class="mini" id="viewshot">View frame</button>`;document.querySelector('#viewshot').onclick=()=>window.open(lastData,'_blank')};document.querySelector('#analyze').onclick=async()=>{if(!lastData)return Mercury.toast('Capture a frame first.');out.textContent='Sending visual intent to Jahorin…';try{const r=await Mercury.dispatch('vision','Analyze the captured camera frame contextually.',{image_data_url:lastData});out.textContent=r?.result?.text||JSON.stringify(r,null,2)}catch(e){out.textContent=e.message}};if(new URLSearchParams(location.search).get('camera')==='1')setTimeout(openCam,350);</script></body></html>
