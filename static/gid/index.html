<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><link rel="stylesheet" href="/css/mercury.css"><link rel="stylesheet" href="/css/skillui.css"><title>Mercury GID</title></head><body data-surface="gid"><main class="app"><section class="viewport capability-viewport"><div class="brand"><strong>Galactic Identity</strong>Jahorin Mercury authentication</div><div class="status">ARI · connecting</div><div class="center-cta"><div class="gid-mark" aria-hidden="true">☿</div><div class="gid-copy">GALACTIC IDENTITY · FREE</div><input id="email" class="field" type="email" autocomplete="email" placeholder="Email"><input id="display" class="field" type="text" autocomplete="name" placeholder="Display name · new members"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Password · 8+ characters"><button id="signup" class="action" type="button">Create Free GID</button><button id="login" class="action secondary" type="button">Sign In</button><p id="member-state" aria-live="polite">Free members enter Mercury immediately when email confirmation is not required by Supabase.</p><input id="code" class="field" type="password" autocomplete="current-password" placeholder="Prime Orchestrator access code"><button id="auth" class="action secondary" type="button">Prime Orchestrator</button><button id="public" class="action secondary" type="button">Continue Public Demo</button></div></section><nav class="dock"></nav></main><script src="/js/runtime.js"></script><script>Mercury.dock('mercury');Mercury.status();const email=document.querySelector('#email');const display=document.querySelector('#display');const password=document.querySelector('#password');const state=document.querySelector('#member-state');const ownerCode=document.querySelector('#code');const show=m=>{state.textContent=m;Mercury.toast(m)};document.querySelector('#signup').onclick=async()=>{try{state.textContent='Creating your Galactic Identity…';const result=await Mercury.auth.signup({email:email.value,password:password.value,display_name:display.value});if(result.confirmation_required){show('GID created. Confirm your email, then sign in.')}else{await Mercury.identity();show('GID active · Free tier. Welcome home.');setTimeout(()=>location.href='/home/',450)}}catch(e){show(e.message)}};document.querySelector('#login').onclick=async()=>{try{state.textContent='Restoring your identity…';await Mercury.auth.login({email:email.value,password:password.value});await Mercury.identity();show('Identity restored. Welcome home.');setTimeout(()=>location.href='/home/',450)}catch(e){show(e.message)}};document.querySelector('#auth').onclick=async()=>{try{await Mercury.authenticate(ownerCode.value);show('Prime Orchestrator authenticated.');setTimeout(()=>location.href='/home/',450)}catch(e){show(e.message)}};document.querySelector('#public').onclick=()=>location.href='/home/?demo=1';</script></body></html>
