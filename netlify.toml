[build]
  # Canonical zero-build SkillUI frontend lives in /static.
  # No build commands or Node dependencies are required.
  base = "static"
  command = ""
  publish = "."

[[redirects]]
  # ARI must resolve before the persistent-shell fallback.
  from = "/api/*"
  to = "https://ari-689058655022.us-west1.run.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  # Route unresolved application paths back to the persistent Mercury Shell.
  # Existing standalone capability index.html files continue to resolve directly.
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  # Zero-build assets keep stable URLs, so they must revalidate after production deploys.
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  # Service worker must always revalidate so production updates activate quickly.
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  # Manifest stays fresh while still allowing short-lived CDN reuse.
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  # Same-origin device capabilities used by SYNCORI Audio and Optics.
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self)"
