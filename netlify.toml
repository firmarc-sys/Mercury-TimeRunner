[build]
  # Canonical zero-build Jahorin Trismegistus frontend lives in /static.
  base = "static"
  command = ""
  publish = "."

[[redirects]]
  # ARI must resolve before the persistent-shell fallback.
  from = "/api/*"
  to = "https://ari-689058655022.us-west1.run.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  # Existing capability routes resolve directly; unknown app routes return to the persistent shell.
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  # Runtime JavaScript must revalidate so a new production revision cannot be masked by stale year-long cache entries.
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  # Runtime CSS must revalidate for the same reason.
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  # Same-origin device capabilities used by voice, SYNCORI Audio and Horus Optics.
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self)"
